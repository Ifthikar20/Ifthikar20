<svg xmlns="http://www.w3.org/2000/svg" width="820" height="204" viewBox="0 0 820 204" role="img" aria-labelledby="stack-title">
  <title id="stack-title">Backend: Python, Django, FastAPI, Node.js. Frontend and mobile: JavaScript, Vue, React, Flutter. Cloud and testing: AWS, Playwright.</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
