# Put this file in your Ifthikar20/Ifthikar20 repo at:
#   .github/workflows/profile.yml
#
# It builds the animated contribution snake and your stats card, then publishes
# them to a branch called "output", which README.md loads the images from.
# Committing this file starts the first run. You can also run it any time from
# the Actions tab -> "Profile images" -> Run workflow.
#
# Note: GitHub pauses scheduled workflows in public repos after 60 days with no
# activity. If the images stop updating, re-enable the workflow in the Actions tab.

name: Profile images

on:
  schedule:
    - cron: "23 5 * * *" # once a day, 05:23 UTC
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&bg_color=0D1117&title_color=39D353&icon_color=26A641&text_color=C9D1D9'
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Keep target_branch as "output": this step overwrites that branch on every run.
      - name: Publish images to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
